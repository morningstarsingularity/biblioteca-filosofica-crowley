<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script><script>(()=>{setTimeout(()=>{const{markmap:S,mm:Q}=window,$=new S.Toolbar;$.attach(Q);const I=$.render();I.setAttribute("style","position:absolute;bottom:20px;right:20px"),document.body.append(I)})})()</script><script>((l,U,M,R)=>{const N=l();window.mm=N.Markmap.create("svg#mindmap",(U||N.deriveOptions)(R),M),window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.classList.add("markmap-dark")})(()=>window.markmap,null,{"content":"Tema 2: Mito y mitolog&#xed;a. Oralidad y escritura","children":[{"content":"Nexo con el Tema 1 (El hombre griego en transici&#xf3;n)","children":[{"content":"La fractura de la presencia viva","children":[{"content":"En el Tema 1, el hombre griego existe proyectado hacia afuera: su identidad depende del reconocimiento visual (<em>tim&#xe9;</em>) y de la memoria comunitaria viva (<em>kl&#xe9;os</em>) (Vernant, 1995, pp. 28-30).","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"El traspaso de la gloria descansaba en el canto po&#xe9;tico oral que manten&#xed;a al h&#xe9;roe arrancado de las sombras del Hades (Vernant, 1995, pp. 16, 29-30).","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"Cuando la palabra deja de ser aire compartido y se petrifica sobre una superficie f&#xed;sica, la relaci&#xf3;n del hombre con el cosmos, la memoria y su propia conciencia se fractura de manera irreversible (Havelock, 1996, pp. 113-133; Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"16,18"}}],"payload":{"tag":"h3","lines":"13,14"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"1. La enciclopedia oral hom&#xe9;rica y la memoria ac&#xfa;stica (Eric A. Havelock)","children":[{"content":"La poes&#xed;a como tecnolog&#xed;a c&#xed;vica y archivo social","children":[{"content":"En una cultura sin transcripci&#xf3;n alfab&#xe9;tica, la poes&#xed;a no es un pasatiempo est&#xe9;tico ni literatura de entretenimiento (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"Constituye el &#xfa;nico mecanismo de almacenamiento de la tradici&#xf3;n: custodia el <em>n&#xf3;mos</em> (la ley consuetudinaria) y el <em>&#xe9;thos</em> (las pautas morales de conducta social) (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"Toda la masa de informaci&#xf3;n t&#xe9;cnica, c&#xed;vica, religiosa, geneal&#xf3;gica e institucional de la comunidad debe conservarse en el verso m&#xe9;trico para no perderse en el olvido (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"22,23"}}],"payload":{"tag":"h3","lines":"19,20"}},{"content":"Mecanismos mnemot&#xe9;cnicos y m&#xed;mesis corporal","children":[{"content":"Ritmo m&#xe9;trico, metro dact&#xed;lico, f&#xf3;rmulas modulares, ep&#xed;tetos fijos y rima como pr&#xf3;tesis mnem&#xf3;nicas obligatorias (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"El aprendizaje se produce por <em>m&#xed;mesis</em>: identificaci&#xf3;n psico-afectiva y visceral absoluta entre el recitador/oyente y el contenido del canto (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"El cuerpo entero (aparato fonador, o&#xed;do, sistema motriz, danza) se compromete activamente en la preservaci&#xf3;n del recuerdo social (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"26,27"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"La expulsi&#xf3;n de los poetas en Plat&#xf3;n (<em>Rep&#xfa;blica</em>)","children":[{"content":"No responde a una mojigater&#xed;a moralizante ni a insensibilidad art&#xed;stica por parte de Plat&#xf3;n (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Es un imperativo epistemol&#xf3;gico radical: para instaurar el pensamiento conceptual, abstracto y reflexivo, es imprescindible quebrar el monopolio educativo del aeda y la hipnosis colectiva de la memoria oral (Havelock, 1996, pp. 19-39).","children":[],"payload":{"tag":"li","lines":"29,31"}}],"payload":{"tag":"h3","lines":"27,28"}}],"payload":{"tag":"h2","lines":"18,19"}},{"content":"2. La revoluci&#xf3;n tecnol&#xf3;gica del alfabeto griego (Eric A. Havelock)","children":[{"content":"La descomposici&#xf3;n anal&#xed;tica del sonido","children":[{"content":"Ruptura frente a los silabarios orientales y la escritura conson&#xe1;ntica fenicia (que depend&#xed;an de un conocimiento oral previo para descifrar el contexto) (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"Aislamiento exhaustivo tanto de las vocales como de las consonantes mudas (unidades abstractas inaudibles por s&#xed; solas en el aire) (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"Transforma el flujo sonoro, fugaz y temporal, en un artefacto visible, espacializado, estable e independiente del hablante (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"35,36"}}],"payload":{"tag":"h3","lines":"32,33"}},{"content":"De la acci&#xf3;n narrativa al concepto abstracto (La sintaxis del Ser)","children":[{"content":"Desmantelamiento de la parataxis oral donde solo actuaban agentes personificados (dioses o h&#xe9;roes haciendo cosas) (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"Creaci&#xf3;n de la sintaxis ontol&#xf3;gica de la definici&#xf3;n formal: entronizaci&#xf3;n del verbo copulativo &quot;ser&quot; (<em>estin</em>) y de categor&#xed;as l&#xf3;gicas estables (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"El lenguaje pasa de describir acontecimientos din&#xe1;micos y singulares a formular esencias universales e intemporales.","children":[],"payload":{"tag":"li","lines":"39,40"}}],"payload":{"tag":"h3","lines":"36,37"}},{"content":"La g&#xe9;nesis de la <em>psych&#x113;</em> y la distancia cr&#xed;tica","children":[{"content":"Al quedar el texto separado del cuerpo del emisor, el mensaje se independiza y puede ser sometido a inspecci&#xf3;n, duda, correcci&#xf3;n y relectura solitaria (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"Nace la distancia cr&#xed;tica entre el sujeto que piensa y el objeto pensado: al quebrarse la identificaci&#xf3;n mim&#xe9;tica colectiva, se crea la interioridad reflexiva (<em>psych&#x113;</em>) y el individuo aut&#xf3;nomo (Havelock, 1996, pp. 113-133).","children":[],"payload":{"tag":"li","lines":"42,44"}}],"payload":{"tag":"h3","lines":"40,41"}}],"payload":{"tag":"h2","lines":"31,32"}},{"content":"3. La reestructuraci&#xf3;n de la conciencia por la escritura (Walter J. Ong)","children":[{"content":"La escritura como tecnolog&#xed;a artificial interiorizada","children":[{"content":"La escritura no es una emanaci&#xf3;n biol&#xf3;gica natural de la voz; es una tecnolog&#xed;a exterior que exige herramientas f&#xed;sicas (c&#xe1;lamo, tinta, soporte) (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"Como toda tecnolog&#xed;a revolucionaria, al ser asimilada profundamente reestructura las redes neuronales y los modos del pensamiento humano (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"47,48"}}],"payload":{"tag":"h3","lines":"45,46"}},{"content":"El discurso aut&#xf3;nomo y la ruptura existencial","children":[{"content":"El texto escrito inaugura el &quot;discurso aut&#xf3;nomo&quot;: palabras que flotan desvinculadas del contexto vital directo, sin entonaci&#xf3;n viva, gestualidad ni mirada compartida (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"El texto es inherentemente irrefutable y sordo: ante el cuestionamiento del lector, no dialoga, no se defiende y se limita a repetir indefinidamente lo mismo (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"50,51"}}],"payload":{"tag":"h3","lines":"48,49"}},{"content":"La paradoja del <em>Fedro</em> plat&#xf3;nico","children":[{"content":"En el <em>Fedro</em>, Plat&#xf3;n recoge el mito egipcio de Teuth y condena la escritura: sostiene que destruye la memoria interna viva (<em>mn&#x113;m&#x113;</em>), instaura un falso recuerdo mec&#xe1;nico exterior (<em>hyp&#xf3;mn&#x113;sis</em>) y enga&#xf1;a con apariencia de saber (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"Paradoja hist&#xf3;rica: Plat&#xf3;n &#xfa;nicamente pudo desarrollar su filosof&#xed;a cr&#xed;tica, abstracta y dial&#xe9;ctica gracias al distanciamiento conceptual que la propia tecnolog&#xed;a de la escritura le suministr&#xf3; (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"53,54"}}],"payload":{"tag":"h3","lines":"51,52"}},{"content":"Reorganizaci&#xf3;n sensorial: del o&#xed;do a la vista","children":[{"content":"La oralidad primaria vive inmersa en el o&#xed;do: sentido din&#xe1;mico, simult&#xe1;neo, resonante y centr&#xed;peto (el sonido envuelve desde todas partes).","children":[],"payload":{"tag":"li","lines":"55,56"}},{"content":"La escritura entroniza la vista: sentido espacial, anal&#xed;tico, lineal, fijo y distanciador (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"La espacializaci&#xf3;n visual del lenguaje hace posibles las listas taxon&#xf3;micas, tablas, &#xed;ndices alfab&#xe9;ticos y encadenamientos silog&#xed;sticos rigurosos, imposibles de retener en la memoria auditiva pura (Ong, 1997, pp. 81-116).","children":[],"payload":{"tag":"li","lines":"57,59"}}],"payload":{"tag":"h3","lines":"54,55"}}],"payload":{"tag":"h2","lines":"44,45"}},{"content":"4. La invenci&#xf3;n de la &#xab;mitolog&#xed;a&#xbb; y la crisis del mito (Marcel Detienne)","children":[{"content":"El mito como objeto construido por la mirada letrada","children":[{"content":"En la Grecia arcaica y oral no exist&#xed;a el concepto de &quot;mitolog&#xed;a&quot; como colecci&#xf3;n de f&#xe1;bulas o relatos ficticios (Detienne, 1985, cap. I).","children":[],"payload":{"tag":"li","lines":"61,62"}},{"content":"El <em>mythos</em> es inventado como categor&#xed;a sospechosa precisamente cuando la escritura lo captura, lo a&#xed;sla de su contexto de enunciaci&#xf3;n festiva y lo deposita en un texto inerte (Detienne, 1985, cap. I).","children":[],"payload":{"tag":"li","lines":"62,63"}}],"payload":{"tag":"h3","lines":"60,61"}},{"content":"De la palabra eficaz cantada al esc&#xe1;ndalo de la raz&#xf3;n","children":[{"content":"En la oralidad tradicional, el relato gozaba de una verdad viva y operante, amparada por la autoridad sagrada de las Musas (Detienne, 1985, cap. I).","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"Al quedar congelados en el texto y ser le&#xed;dos con la nueva mirada anal&#xed;tica, los amores, cr&#xed;menes, monstruosidades e incoherencias de los dioses hom&#xe9;ricos y hesi&#xf3;dicos se transforman en un esc&#xe1;ndalo intolerable para la raz&#xf3;n c&#xed;vica (Detienne, 1985, cap. I).","children":[],"payload":{"tag":"li","lines":"65,66"}}],"payload":{"tag":"h3","lines":"63,64"}},{"content":"El nacimiento de la hermen&#xe9;utica y la alegor&#xed;a","children":[{"content":"Ante la imposibilidad de aceptar literalmente las historias de los dioses fijadas en los textos, los pensadores (desde Jen&#xf3;fanes y Te&#xe1;genes de Regio) se ven forzados a inventar la interpretaci&#xf3;n aleg&#xf3;rica (Detienne, 1985, cap. I).","children":[],"payload":{"tag":"li","lines":"67,68"}},{"content":"Se postula la existencia de un sentido oculto o subyacente (<em>hyponoia</em>) bajo la superficie monstruosa o rid&#xed;cula del relato m&#xed;tico: la mitolog&#xed;a nace como problema en el instante en que el mito deja de ser cre&#xed;do ingenuamente (Detienne, 1985, cap. I).","children":[],"payload":{"tag":"li","lines":"68,69"}}],"payload":{"tag":"h3","lines":"66,67"}}],"payload":{"tag":"h2","lines":"59,60"}},{"content":"5. Bibliograf&#xed;a consultada","children":[{"content":"Libros","children":[{"content":"Detienne, M. (1985). La invenci&#xf3;n de la mitolog&#xed;a (M. A. Galmarini, Trad., Cap. I). Pen&#xed;nsula.","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"Havelock, E. A. (1996). La musa aprende a escribir: Reflexiones sobre la oralidad y escritura desde la Antig&#xfc;edad hasta el presente (L. Bredlow Wenda, Trad., pp. 19-39, 113-133). Paid&#xf3;s.","children":[],"payload":{"tag":"li","lines":"72,73"}},{"content":"Ong, W. J. (1997). La escritura reestructura la conciencia. En Oralidad y escritura: Tecnolog&#xed;as de la palabra (pp. 81-116). Fondo de Cultura Econ&#xf3;mica.","children":[],"payload":{"tag":"li","lines":"73,74"}}],"payload":{"tag":"h3","lines":"70,71"}}],"payload":{"tag":"h2","lines":"69,70"}}],"payload":{"tag":"h1","lines":"10,11"}},{"color":["#c084fc","#f472b6","#a78bfa","#d8b4fe"],"maxWidth":300})</script>
