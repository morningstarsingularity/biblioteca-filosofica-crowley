<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script><script>(()=>{setTimeout(()=>{const{markmap:S,mm:Q}=window,$=new S.Toolbar;$.attach(Q);const I=$.render();I.setAttribute("style","position:absolute;bottom:20px;right:20px"),document.body.append(I)})})()</script><script>((l,U,M,R)=>{const N=l();window.mm=N.Markmap.create("svg#mindmap",(U||N.deriveOptions)(R),M),window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.classList.add("markmap-dark")})(()=>window.markmap,null,{"content":"Tema 1: El hombre griego","children":[{"content":"1. El hombre en el k&#xf3;smos y la frontera con lo divino (Jean-Pierre Vernant)","children":[{"content":"La &apos;ph&#xfd;sis&apos; animada y el estatuto c&#xf3;smico del hombre","children":[{"content":"El universo constituye un <em>k&#xf3;smos</em>: totalidad ordenada, arm&#xf3;nica y bella que rechaza la escisi&#xf3;n moderna sujeto/objeto (Vernant, 1995, pp. 21-22).","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"La <em>ph&#xfd;sis</em> no es materia inerte; es una potencia viva, din&#xe1;mica y &quot;demon&#xed;aca&quot; (<em>daimon&#xed;a</em>) con la que el hombre est&#xe1; emparentado de forma connatural (Vernant, 1995, pp. 21-22).","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"La teor&#xed;a de la visi&#xf3;n: ver no es procesar im&#xe1;genes pasivamente, sino proyectar un rayo &#xed;gneo (<em>phosphora &#xf3;mmata</em>) que se une a la luz solar para tocar f&#xed;sicamente lo real (Vernant, 1995, pp. 22-25).","children":[],"payload":{"tag":"li","lines":"16,17"}}],"payload":{"tag":"h3","lines":"13,14"}},{"content":"La alteridad divina y los l&#xed;mites de la condici&#xf3;n mortal","children":[{"content":"Los dioses no son trascendentes ni creadores <em>ex nihilo</em>; nacen en el interior del cosmos a partir de potencias primordiales como Caos y Gea (Vernant, 1995, pp. 15-16).","children":[],"payload":{"tag":"li","lines":"18,19"}},{"content":"La frontera ontol&#xf3;gica infranqueable: los dioses son los <em>athanatoi</em> (inmortales sin vejez ni carencia); el hombre est&#xe1; signado por la privaci&#xf3;n, el dolor y la muerte (Vernant, 1995, pp. 16-17).","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"Regla cardinal de la sabidur&#xed;a c&#xed;vica: rechazo de la <em>h&#xfd;bris</em>; el mortal debe conocer sus l&#xed;mites y no pretender igualarse a los dioses (Vernant, 1995, pp. 16-17, 26).","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"El culto c&#xed;vico como deuda y embellecimiento: sin dogmas cerrados ni clero coercitivo, el ritual (sacrificios, danzas, coros) mantiene la armon&#xed;a comunitaria entre hombres libres (Vernant, 1995, pp. 17-20).","children":[],"payload":{"tag":"li","lines":"21,22"}}],"payload":{"tag":"h3","lines":"17,18"}},{"content":"Identidad exterior: &apos;tim&#xe9;&apos;, la mirada del otro y el &apos;kl&#xe9;os&apos;","children":[{"content":"Ausencia del <em>cogito</em> o la introspecci&#xf3;n subjetiva: el autoconocimiento es especular, el ojo y el alma solo se conocen reflej&#xe1;ndose en otro semejante (Vernant, 1995, pp. 26-27).","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"Cultura del honor y la verg&#xfc;enza: la identidad coincide con la estimaci&#xf3;n social (<em>tim&#xe9;</em>); perder el reconocimiento de los pares equivale a no ser nadie (Vernant, 1995, pp. 27-28).","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"La inmortalidad como memoria c&#xed;vica: el Hades es solo un reino de sombras vac&#xed;as; la &#xfa;nica victoria sobre la muerte es la gloria imperecedera (<em>kl&#xe9;os &#xe1;phthiton</em>) fijada por el canto po&#xe9;tico y el monumento (Vernant, 1995, pp. 29-31).","children":[],"payload":{"tag":"li","lines":"25,27"}}],"payload":{"tag":"h3","lines":"22,23"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"2. La trastienda del h&#xe9;roe: mujeres, matrimonio y propiedad (Sarah B. Pomeroy)","children":[{"content":"La mujer en la &#xe9;pica hom&#xe9;rica (Edad del Bronce)","children":[{"content":"Contradicci&#xf3;n estructural: figuras de reinas con relieve dram&#xe1;tico e influencia palacial frente a un estatuto objetivo de subordinaci&#xf3;n patriarcal (Pomeroy, 1987, pp. 31-33).","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"Las mujeres como propiedad, bot&#xed;n de guerra (<em>g&#xe9;ras</em>) y premio: su posesi&#xf3;n incrementa directamente la <em>tim&#xe9;</em> del guerrero y desata contiendas mortales (Pomeroy, 1987, pp. 40-41).","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"Estrategias de alianza conyugal: coexistencia de enlaces patrilocales (la dote atrae y sella pactos) y matrilocales/matrilineales (el h&#xe9;roe hereda el trono mediante pruebas) (Pomeroy, 1987, pp. 33-35).","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"Doble moral sexual: obligaci&#xf3;n de monogamia y castidad para la esposa a fin de asegurar herederos leg&#xed;timos frente al libre acceso del var&#xf3;n a concubinas y esclavas (Pomeroy, 1987, pp. 41-43).","children":[],"payload":{"tag":"li","lines":"32,33"}}],"payload":{"tag":"h3","lines":"28,29"}},{"content":"La bifurcaci&#xf3;n arcaica: Esparta doria frente a Atenas j&#xf3;nica","children":[{"content":"El modelo espartano (c&#xf3;digo de Licurgo): Estado militarizado donde la mujer es valorada como reproductora de soldados para la falange (Pomeroy, 1987, pp. 50-52).","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"Privilegios de la espartana: nutrici&#xf3;n equivalente al var&#xf3;n, gimnasia y carreras al aire libre, exenci&#xf3;n de labores dom&#xe9;sticas y control real sobre dotes y tierras (Pomeroy, 1987, pp. 51-54).","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"El modelo de Gortina (Creta): leyes que reconocen derechos patrimoniales a la mujer libre e incluso capacidad jur&#xed;dica limitada para la sierva y la <em>patro&#xef;okhos</em> (Pomeroy, 1987, pp. 54-57).","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"La reclusi&#xf3;n en la Atenas j&#xf3;nica: confinamiento de la mujer libre al gineceo, invisibilidad social y tutela perpetua del <em>k&#xfd;rios</em> bajo la ley de Sol&#xf3;n (Pomeroy, 1987, pp. 57, 73-76).","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"La <em>epikl&#x113;ros</em> ateniense: la heredera sin hermanos no posee la tierra; queda integrada como veh&#xed;culo para transmitir la propiedad familiar al pariente var&#xf3;n m&#xe1;s pr&#xf3;ximo (Pomeroy, 1987, pp. 77-78).","children":[],"payload":{"tag":"li","lines":"38,40"}}],"payload":{"tag":"h3","lines":"33,34"}}],"payload":{"tag":"h2","lines":"27,28"}},{"content":"3. Del orden aristocr&#xe1;tico a la interrogaci&#xf3;n socr&#xe1;tica (Pierre Hadot)","children":[{"content":"De la &apos;historia&apos; j&#xf3;nica a la fractura de la &apos;paideia&apos; tradicional","children":[{"content":"Nacimiento de la <em>historia</em> en Mileto: ruptura con las cosmogon&#xed;as m&#xed;ticas para buscar una explicaci&#xf3;n racional de la <em>ph&#xfd;sis</em> f&#xed;sica accesible a la observaci&#xf3;n (Hadot, 1998, pp. 23-25).","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"La <em>paideia</em> nobiliaria tradicional: transmisi&#xf3;n comunitaria de la excelencia (<em>aret&#xe9;</em>) por &#xf3;smosis y emulaci&#xf3;n directa en la convivencia de adultos y j&#xf3;venes (<em>sunousia</em>) (Hadot, 1998, pp. 26-27).","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"La crisis c&#xed;vica y la revoluci&#xf3;n sof&#xed;stica: la democracia y los tribunales demandan nuevas competencias; los sofistas profesionalizan la ret&#xf3;rica y venden el arte de persuadir como t&#xe9;cnica de poder (Hadot, 1998, pp. 28-30).","children":[],"payload":{"tag":"li","lines":"44,45"}}],"payload":{"tag":"h3","lines":"41,42"}},{"content":"La resignificaci&#xf3;n socr&#xe1;tico-plat&#xf3;nica del fil&#xf3;sofo (<em>Banquete</em>)","children":[{"content":"S&#xf3;crates como encarnaci&#xf3;n demon&#xed;aca de Eros: hijo de Poros (Recurso/Astucia) y Penia (Pobreza/Carencia) (Hadot, 1998, pp. 45-47).","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"La ontolog&#xed;a del intervalo (<em>metaxy</em>): el fil&#xf3;sofo no es el dios omnisciente que posee la <em>sophia</em> ni el insensato que ignora su propia ignorancia (Hadot, 1998, pp. 47-50).","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"La <em>philosophia</em> como deseo y modo de vida: no es construcci&#xf3;n de un sistema doctrinal abstracto cerrado, sino ejercicio cotidiano de desacomodo y transformaci&#xf3;n personal del ser (<em>bios</em>) (Hadot, 1998, pp. 50-53).","children":[],"payload":{"tag":"li","lines":"48,50"}}],"payload":{"tag":"h3","lines":"45,46"}}],"payload":{"tag":"h2","lines":"40,41"}},{"content":"5. Bibliograf&#xed;a consultada","children":[{"content":"Libros","children":[{"content":"Hadot, P. (1998). &#xbf;Qu&#xe9; es la filosof&#xed;a antigua? (E. Cazenave Tapie Isoard, Trad.). Fondo de Cultura Econ&#xf3;mica.","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"Pomeroy, S. B. (1987). Diosas, rameras, esposas y esclavas: Mujeres en la antig&#xfc;edad cl&#xe1;sica (R. Lezcano Escudero, Trad.). Akal.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"Vernant, J.-P. (1995). Introducci&#xf3;n: El hombre griego. En J.-P. Vernant (Ed.), El hombre griego (P. B&#xe1;denas de la Pe&#xf1;a, A. Bravo Garc&#xed;a, &amp; J. A. Ochoa Anad&#xf3;n, Trads., pp. 9-31). Alianza Editorial.","children":[],"payload":{"tag":"li","lines":"54,55"}}],"payload":{"tag":"h3","lines":"51,52"}}],"payload":{"tag":"h2","lines":"50,51"}}],"payload":{"tag":"h1","lines":"10,11"}},{"color":["#c084fc","#f472b6","#a78bfa","#d8b4fe"],"maxWidth":300})</script>
