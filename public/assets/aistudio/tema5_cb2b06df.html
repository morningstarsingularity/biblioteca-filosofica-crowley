:"13,14"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"1. El efecto sof&#xed;stico y la soberan&#xed;a del lenguaje (Barbara Cassin)","children":[{"content":"El tratado de Gorgias frente al poema parmen&#xed;deo","children":[{"content":"Subversi&#xf3;n par&#xf3;dica de la ontolog&#xed;a ele&#xe1;tica en <em>Sobre el no ser o sobre la naturaleza</em> (Cassin, 2008, pp. 24-28).","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"Las tres tesis demoledoras de Gorgias: 1) nada es; 2) si algo fuese, ser&#xed;a incognoscible; 3) si fuese cognoscible, ser&#xed;a incomunicable (Cassin, 2008, pp. 25-29).","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"Quiebra de la tesis parmen&#xed;dea de la identidad entre ser, pensar y decir: el discurso no devela una realidad previa exterior, sino que se afirma en su propia autonom&#xed;a formal (Cassin, 2008, pp. 28-32).","children":[],"payload":{"tag":"li","lines":"22,23"}}],"payload":{"tag":"h3","lines":"19,20"}},{"content":"De la ontolog&#xed;a a la logolog&#xed;a","children":[{"content":"El &quot;Ser&quot; no es un dato primordial develado por la palabra, sino un artefacto sint&#xe1;ctico fabricado por el propio lenguaje (Cassin, 2008, pp. 31-35).","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"Desplazamiento epistemol&#xf3;gico: del discurso sobre el ser (ontolog&#xed;a) al an&#xe1;lisis del poder constitutivo y productor de mundo de la palabra (logolog&#xed;a) (Cassin, 2008, pp. 32-36).","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"La palabra como <em>ph&#xe1;rmakon</em> y d&#xe9;spota poderoso (<em>Encomio de Helena</em>): con un cuerpo diminuto e invisible, el <em>l&#xf3;gos</em> cautiva el alma, engendra persuasi&#xf3;n (<em>Peith&#x14d;</em>) y altera las opiniones sin subordinarse a una verdad previa (Cassin, 2008, pp. 36-39).","children":[],"payload":{"tag":"li","lines":"26,27"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"La r&#xe9;plica aristot&#xe9;lica: el principio de no contradicci&#xf3;n (&apos;Metaf&#xed;sica&apos; Gamma)","children":[{"content":"Arist&#xf3;teles busca refutar el relativismo sof&#xed;stico imponiendo un axioma irreductible para la inteligibilidad (Cassin, 2008, pp. 39-42).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"La exigencia del significado un&#xed;voco: hablar (<em>l&#xe9;gein ti</em>) equivale necesariamente a significar algo determinado (<em>s&#x113;ma&#xed;nein ti</em>) para s&#xed; y para los dem&#xe1;s (Cassin, 2008, pp. 41-44).","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"Consecuencia ontol&#xf3;gica: si el sofista rechaza significar una esencia &#xfa;nica y afirma contradictorios al mismo tiempo, destruye el lenguaje, se excluye de la comunidad c&#xed;vica y se degrada a la condici&#xf3;n de una &quot;planta que habla&quot; (Cassin, 2008, pp. 43-45).","children":[],"payload":{"tag":"li","lines":"30,32"}}],"payload":{"tag":"h3","lines":"27,28"}}],"payload":{"tag":"h2","lines":"18,19"}},{"content":"2. La invenci&#xf3;n de la raz&#xf3;n (Fran&#xe7;ois Ch&#xe2;telet)","children":[{"content":"El nacimiento c&#xed;vico y pol&#xed;tico de la racionalidad","children":[{"content":"La raz&#xf3;n (<em>l&#xf3;gos</em>) no es un don divino ni una facultad universal intemporal, sino una creaci&#xf3;n cultural concreta de la Atenas del siglo V a.C. (Ch&#xe2;telet, 1993, pp. 15-20).","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"La secularizaci&#xf3;n del debate: las decisiones de la ciudad dejan de fundarse en el or&#xe1;culo o en la sangre noble y se trasladan a la plaza p&#xfa;blica (<em>&#xe1;gora</em>) (Ch&#xe2;telet, 1993, pp. 18-23).","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"La institucionalizaci&#xf3;n de la ret&#xf3;rica por los sofistas: respuesta pedag&#xf3;gica a la necesidad c&#xed;vica de dominar el arte de la persuasi&#xf3;n en la asamblea y los tribunales (Ch&#xe2;telet, 1993, pp. 22-26).","children":[],"payload":{"tag":"li","lines":"36,37"}}],"payload":{"tag":"h3","lines":"33,34"}},{"content":"La subversi&#xf3;n socr&#xe1;tica: el alumbramiento del concepto","children":[{"content":"S&#xf3;crates toma las herramientas dial&#xe9;cticas de la ciudad, pero invierte el prop&#xf3;sito de la ret&#xf3;rica mercenaria (Ch&#xe2;telet, 1993, pp. 26-29).","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"La iron&#xed;a y el desmantelamiento de la <em>d&#xf3;xa</em>: demuestra que los sabios aparentes (pol&#xed;ticos, generales, artesanos) no poseen un saber fundado (Ch&#xe2;telet, 1993, pp. 27-31).","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"La exigencia de la definici&#xf3;n formal: el paso decisivo hacia la raz&#xf3;n conceptual al exigir responder a la pregunta &quot;&#xbf;qu&#xe9; es?&quot; (<em>t&#xed; esti</em>), buscando la estructura universal de la virtud, la justicia o el valor por encima de los casos emp&#xed;ricos singulares (Ch&#xe2;telet, 1993, pp. 30-33).","children":[],"payload":{"tag":"li","lines":"40,41"}}],"payload":{"tag":"h3","lines":"37,38"}},{"content":"La refundaci&#xf3;n plat&#xf3;nica de la verdad contra la demagogia","children":[{"content":"El diagn&#xf3;stico de Plat&#xf3;n: la democracia que condena a S&#xf3;crates ha degenerate en demagogia donde la masa arbitraria confunde la fuerza con el derecho (Ch&#xe2;telet, 1993, pp. 32-35).","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"La dial&#xe9;ctica y el mundo de las Ideas (<em>E&#xed;d&#x113;</em>): postulaci&#xf3;n de un tribunal objetivo, inmutable y trascendente de esencias como &#xfa;nico soporte leg&#xed;timo del conocimiento (Ch&#xe2;telet, 1993, pp. 33-36).","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"El fil&#xf3;sofo contra el sofista: el saber (<em>epist&#xe9;m&#x113;</em>) se distingue de la opini&#xf3;n halagadora; solo quien contempla la Idea de Bien est&#xe1; capacitado para ordenar rectamente la ciudad (Ch&#xe2;telet, 1993, pp. 35-37).","children":[],"payload":{"tag":"li","lines":"44,46"}}],"payload":{"tag":"h3","lines":"41,42"}}],"payload":{"tag":"h2","lines":"32,33"}},{"content":"3. La ret&#xf3;rica f&#xfa;nebre y la invenci&#xf3;n ideol&#xf3;gica de Atenas (Nicole Loraux)","children":[{"content":"El &apos;epit&#xe1;phios l&#xf3;gos&apos; como discurso hegem&#xf3;nico de la ciudad","children":[{"content":"La oraci&#xf3;n f&#xfa;nebre anual en el Cer&#xe1;mico: instituci&#xf3;n oficial ateniense donde la palabra p&#xfa;blica celebra comunitariamente a los ca&#xed;dos en la guerra (Loraux, 2012, pp. 237-239).","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"La fabricaci&#xf3;n del imaginario c&#xed;vico: el discurso no hace historia factual ni an&#xe1;lisis sociol&#xf3;gico real; inventa una Atenas ideal, indivisa y eterna (Loraux, 2012, pp. 237-241).","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"El g&#xe9;nero oratorio unifica lo m&#xed;tico y lo pol&#xed;tico: la autocton&#xed;a (el origen m&#xed;tico como hijos nacidos de la propia tierra del &#xc1;tica) justifica la nobleza intr&#xed;nseca y la igualdad natural de todos los ciudadanos (Loraux, 2012, pp. 239-243).","children":[],"payload":{"tag":"li","lines":"50,51"}}],"payload":{"tag":"h3","lines":"47,48"}},{"content":"Los problemas de un &apos;l&#xf3;gos politik&#xf3;s&apos;: el silenciamiento del conflicto","children":[{"content":"La operaci&#xf3;n ideol&#xf3;gica del elogio: conjurar y borrar la divisi&#xf3;n interna de la ciudad, la guerra civil (<em>st&#xe1;sis</em>) y las contradicciones de clase (Loraux, 2012, pp. 242-245).","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"Presentaci&#xf3;n de la democracia sin sus asperezas: en la oratoria f&#xfa;nebre, el poder del pueblo (<em>kr&#xe1;tos</em>) se estiliza como consenso arm&#xf3;nico y nobleza de esp&#xed;ritu (Loraux, 2012, pp. 244-247).","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"La metamorfosis del h&#xe9;roe hom&#xe9;rico en ciudadano modelo: la &quot;muerte bella&quot; ya no pertenece al arist&#xf3;crata aislado en busca de gloria individual, sino al cuerpo colectivo de los ca&#xed;dos sacrificados por la abstracci&#xf3;n de la patria ateniense (Loraux, 2012, pp. 245-248).","children":[],"payload":{"tag":"li","lines":"54,56"}}],"payload":{"tag":"h3","lines":"51,52"}}],"payload":{"tag":"h2","lines":"46,47"}},{"content":"5. Bibliograf&#xed;a consultada","children":[{"content":"Libros","children":[{"content":"Cassin, B. (2008). El efecto sof&#xed;stico (A. P. Vivanco, Trad., pp. 24-45). Fondo de Cultura Econ&#xf3;mica.","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"Ch&#xe2;telet, F. (1993). La invenci&#xf3;n de la raz&#xf3;n. En Una historia de la raz&#xf3;n: Conversaciones con &#xc9;mile No&#xeb;l (pp. 15-37). Nueva Visi&#xf3;n.","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"Loraux, N. (2012). Los problemas de un logos politik&#xf3;s. En La invenci&#xf3;n de Atenas: Historia de la oraci&#xf3;n f&#xfa;nebre en la &quot;ciudad cl&#xe1;sica&quot; (S. Vassallo, Trad., pp. 237-248). Katz Editores.","children":[],"payload":{"tag":"li","lines":"60,61"}}],"payload":{"tag":"h3","lines":"57,58"}}],"payload":{"tag":"h2","lines":"56,57"}}],"payload":{"tag":"h1","lines":"10,11"}},{"color":["#c084fc","#f472b6","#a78bfa","#d8b4fe"],"maxWidth":300})</script>
