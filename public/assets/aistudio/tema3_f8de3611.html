<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script><script>(()=>{setTimeout(()=>{const{markmap:S,mm:Q}=window,$=new S.Toolbar;$.attach(Q);const I=$.render();I.setAttribute("style","position:absolute;bottom:20px;right:20px"),document.body.append(I)})})()</script><script>((l,U,M,R)=>{const N=l();window.mm=N.Markmap.create("svg#mindmap",(U||N.deriveOptions)(R),M),window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.classList.add("markmap-dark")})(()=>window.markmap,null,{"content":"Tema 3: Musas y poetas. Verdad, rito y crisis de soberan&#xed;a","children":[{"content":"0. Nexo con los Temas 1 y 2 (De la memoria encarnada a la secularizaci&#xf3;n del orden)","children":[{"content":"La transformaci&#xf3;n del estatuto de la palabra","children":[{"content":"En los temas previos, el reconocimiento c&#xed;vico (<em>tim&#xe9;</em>) y la preservaci&#xf3;n de la memoria (<em>kl&#xe9;os</em>) depend&#xed;an del canto po&#xe9;tico para no caer en el Hades.","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"La fijaci&#xf3;n alfab&#xe9;tica objetiv&#xf3; la palabra, pero es en el plano sociopol&#xed;tico donde se consuma su verdadera metamorfosis (Detienne, 1981, pp. 21-38; Vernant, 1992, pp. 61-79).","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"La palabra deja de ser una revelaci&#xf3;n oracular o decreto m&#xe1;gico monopolizado por poetas y reyes sagrados, y se arroja &quot;al centro&quot; (<em>es t&#xf2; m&#xe9;son</em>) de la comunidad (Detienne, 1981, pp. 21-38; Vernant, 1992, pp. 61-79).","children":[],"payload":{"tag":"li","lines":"16,18"}}],"payload":{"tag":"h3","lines":"13,14"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"1. La memoria del poeta y los maestros de verdad (Marcel Detienne)","children":[{"content":"Mnemosyne como potencia sagrada y videncia c&#xf3;smica","children":[{"content":"En la Grecia arcaica, la Memoria (<em>Mn&#x113;mos&#xfd;n&#x113;</em>) no constituye una facultad psicol&#xf3;gica individual ni un archivo cronol&#xf3;gico profano (Detienne, 1981, pp. 21-25).","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"Opera como una potencia m&#xed;tico-religiosa de naturaleza adivinatoria: quien es pose&#xed;do por las Musas accede al &quot;m&#xe1;s all&#xe1;&quot; y contempla directamente &quot;lo que es, lo que ser&#xe1; y lo que fue&quot; (Detienne, 1981, pp. 21-26).","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"El poeta (<em>aoid&#xf3;s</em>) comparte estatuto con el adivino y el rey de justicia: su palabra no describe objetos emp&#xed;ricos exteriores, sino que participa de la sacralidad y desvela realidades invisibles (Detienne, 1981, pp. 26-28).","children":[],"payload":{"tag":"li","lines":"22,23"}}],"payload":{"tag":"h3","lines":"19,20"}},{"content":"La eficacia realizadora del canto y el estatuto de la palabra (&apos;krainein&apos;)","children":[{"content":"La palabra po&#xe9;tica arcaica no se rige por la adecuaci&#xf3;n emp&#xed;rica o l&#xf3;gica (<em>adaequatio</em>), sino por su eficacia m&#xe1;gica y realizadora (<em>krainein</em>: realizar, hacer advenir) (Detienne, 1981, pp. 28-32).","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"Cantar la teogon&#xed;a o los linajes de dioses y hombres no es una transmisi&#xf3;n neutra de datos, sino un acto que colabora activamente en el sostenimiento del cosmos (Detienne, 1981, pp. 28-33).","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"La palabra del aeda produce ontolog&#xed;a: la alabanza otorga consistencia luminosa (<em>kl&#xe9;os</em>); el silencio o la censura condenan al ser a la inexistencia (Detienne, 1981, pp. 31-34).","children":[],"payload":{"tag":"li","lines":"26,27"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"La polaridad m&#xed;tica: &apos;Al&#xe9;theia&apos; frente a &apos;L&#xe9;th&#x113;&apos;","children":[{"content":"En el marco religioso tradicional, la Verdad (<em>Al&#xe9;theia</em>) no tiene como ant&#xf3;nimo a la mentira o al error intelectual (<em>pse&#xfb;dos</em>) (Detienne, 1981, pp. 34-36).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Su opuesto estricto es el Olvido (<em>L&#xe9;th&#x113;</em>), potencia vinculada a la Noche, la Muerte, las sombras del Hades y el silencio sepulcral (Detienne, 1981, pp. 34-38).","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<em>Al&#xe9;theia</em> es el acto de &quot;desocultamiento&quot; que rescata al h&#xe9;roe de las sombras; quien no es cantado cae en <em>L&#xe9;th&#x113;</em>, mientras que la memoria po&#xe9;tica le concede una presencia imperecedera (Detienne, 1981, pp. 36-38).","children":[],"payload":{"tag":"li","lines":"30,32"}}],"payload":{"tag":"h3","lines":"27,28"}}],"payload":{"tag":"h2","lines":"18,19"}},{"content":"2. El universo espiritual de la p&#xf3;lis y la crisis de soberan&#xed;a (Jean-Pierre Vernant)","children":[{"content":"El derrumbe del sistema palacial mic&#xe9;nico y la secularizaci&#xf3;n del poder","children":[{"content":"El colapso del orden mic&#xe9;nico (hacia 1200 a.C.) extingue al <em>&#xc1;nax</em>: rey sagrado que concentraba en el secreto del palacio el poder militar, religioso, judicial y burocr&#xe1;tico (Vernant, 1992, pp. 61-63).","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"La soberan&#xed;a deja de ser un monopolio dom&#xe9;stico herm&#xe9;tico; el poder se fragmenta, se socializa y pierde su aura m&#xed;stica de origen divino (Vernant, 1992, pp. 63-65).","children":[],"payload":{"tag":"li","lines":"35,36"}}],"payload":{"tag":"h3","lines":"33,34"}},{"content":"La preeminencia de la palabra-debate y la ret&#xf3;rica c&#xed;vica","children":[{"content":"En la <em>p&#xf3;lis</em>, la palabra se desliga de los rituales inapelables y de los decretos soberanos verticales (Vernant, 1992, pp. 61-63).","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"Se transforma en debate contradictorio, discusi&#xf3;n argumentada y persuasi&#xf3;n rec&#xed;proca (<em>Peith&#x14d;</em>) ante el juicio de los ciudadanos reunidos (Vernant, 1992, pp. 61-64).","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"La pol&#xed;tica se vuelve indisociable del <em>l&#xf3;gos</em>: toda decisi&#xf3;n colectiva debe defenderse con razones p&#xfa;blicas y someterse a la cr&#xed;tica de los contrincantes (Vernant, 1992, pp. 62-65).","children":[],"payload":{"tag":"li","lines":"39,40"}}],"payload":{"tag":"h3","lines":"36,37"}},{"content":"Publicidad, el centro c&#xed;vico (&apos;es t&#xf2; m&#xe9;son&apos;) y la geometr&#xed;a del poder","children":[{"content":"Secularizaci&#xf3;n del espacio: lo que antes pertenec&#xed;a a las arcas palaciales o a los linajes cerrados (<em>g&#xe9;n&#x113;</em>) se deposita en el espacio com&#xfa;n del &#xe1;gora (Vernant, 1992, pp. 64-67).","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"El poder se coloca &quot;en el centro&quot; (<em>es t&#xf2; m&#xe9;son</em>), a la vista y al alcance igualitario de la comunidad (Vernant, 1992, pp. 64-67).","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"La ley escrita (<em>n&#xf3;mos</em>) garantiza permanencia y fijeza objetiva: arrebata la justicia al arbitrio de los magistrados nobles y asegura una medida com&#xfa;n aplicable a todos (Vernant, 1992, pp. 66-68).","children":[],"payload":{"tag":"li","lines":"43,44"}}],"payload":{"tag":"h3","lines":"40,41"}},{"content":"La revoluci&#xf3;n hopl&#xed;tica y la invenci&#xf3;n de la isonom&#xed;a","children":[{"content":"Transformaci&#xf3;n t&#xe1;ctica: la proeza aislada del arist&#xf3;crata a caballo o en carro cede ante la formaci&#xf3;n compacta de la infanter&#xed;a hopl&#xed;tica (Vernant, 1992, pp. 68-72).","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"En la falange, el arrebato individual desmedido (<em>l&#xfd;ssa</em>) es reemplazado por la templanza, la disciplina y la cohesi&#xf3;n de grupo (<em>s&#x14d;phros&#xfd;n&#x113;</em>), donde cada combatiente defiende a quien marcha a su lado (Vernant, 1992, pp. 70-74).","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"Surgimiento de la <em>isonom&#xed;a</em>: los ciudadanos se reconocen como semejantes (<em>h&#xf3;moioi</em>) e iguales (<em>&#xed;soi</em>); el orden c&#xed;vico pasa de ser una pir&#xe1;mide vertical a un c&#xed;rculo sim&#xe9;trico donde las magistraturas rotan peri&#xf3;dicamente (Vernant, 1992, pp. 74-79).","children":[],"payload":{"tag":"li","lines":"47,48"}}],"payload":{"tag":"h3","lines":"44,45"}}],"payload":{"tag":"h2","lines":"32,33"}},{"content":"5. Bibliograf&#xed;a consultada","children":[{"content":"Libros","children":[{"content":"Detienne, M. (1981). La memoria del poeta. En Los maestros de verdad en la Grecia arcaica (J. J. Herrera, Trad., pp. 21-38). Taurus.","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"Vernant, J.-P. (1992). El universo espiritual de la polis. En Los or&#xed;genes del pensamiento griego (pp. 61-79). Paid&#xf3;s.","children":[],"payload":{"tag":"li","lines":"51,52"}}],"payload":{"tag":"h3","lines":"49,50"}}],"payload":{"tag":"h2","lines":"48,49"}}],"payload":{"tag":"h1","lines":"10,11"}},{"color":["#c084fc","#f472b6","#a78bfa","#d8b4fe"],"maxWidth":300})</script>
