load":{"tag":"h3","lines":"13,14"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"1. La p&#xf3;lis griega y la creaci&#xf3;n de la democracia (Cornelius Castoriadis)","children":[{"content":"La democracia como autoinstituci&#xf3;n expl&#xed;cita de la sociedad","children":[{"content":"Ruptura radical con la heteronom&#xed;a tradicional: las sociedades previas justificaban sus leyes como mandatos de los dioses, ancestros o el orden c&#xf3;smico natural (Castoriadis, 1988, pp. 97-105).","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"La <em>p&#xf3;lis</em> democr&#xe1;tica nace cuando la comunidad reconoce conscientemente que las leyes (<em>n&#xf3;moi</em>) son su propia creaci&#xf3;n y responsabilidad hist&#xf3;rica (Castoriadis, 1988, pp. 102-108).","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"Apertura de la interrogaci&#xf3;n ilimitada: al saberse fuente de la norma, la sociedad se plantea permanentemente la pregunta: &quot;&#xbf;es justa esta ley?&quot; (Castoriadis, 1988, pp. 105-112).","children":[],"payload":{"tag":"li","lines":"22,23"}}],"payload":{"tag":"h3","lines":"19,20"}},{"content":"Coemergencia indisociable de democracia y filosof&#xed;a","children":[{"content":"Pol&#xed;tica y filosof&#xed;a nacen en el mismo momento hist&#xf3;rico y sobre el mismo suelo: encarnan la quiebra del cierre dogm&#xe1;tico institucional y cognitivo (Castoriadis, 1988, pp. 108-115).","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"As&#xed; como la pol&#xed;tica cuestiona las instituciones establecidas, la filosof&#xed;a cuestiona las representaciones heredadas del saber y busca el fundamento de la verdad (Castoriadis, 1988, pp. 110-118).","children":[],"payload":{"tag":"li","lines":"25,26"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"El trasfondo del &apos;ch&#xe1;os&apos; y la ausencia de teolog&#xed;a consoladora","children":[{"content":"El horizonte ontol&#xf3;gico griego parte del abismo: el fondo &#xfa;ltimo del ser es <em>ch&#xe1;os</em>, vac&#xed;o, ausencia de sentido providencial predeterminado (Castoriadis, 1988, pp. 115-122).","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"Rechazo del m&#xe1;s all&#xe1; compensatorio: el ser humano est&#xe1; abocado a la finitud mortal; no hay un Dios bondadoso que garantice la salvaci&#xf3;n final o d&#xe9; sentido al sufrimiento (Castoriadis, 1988, pp. 118-124).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"La creaci&#xf3;n democr&#xe1;tica es tr&#xe1;gica: los hombres asumen la tarea de autolimitarse y darse orden en el borde mismo de la nada y de la desmesura (<em>h&#xfd;bris</em>) (Castoriadis, 1988, pp. 120-126).","children":[],"payload":{"tag":"li","lines":"29,30"}}],"payload":{"tag":"h3","lines":"26,27"}},{"content":"Democracia directa frente al Estado representativo y burocr&#xe1;tico","children":[{"content":"Identidad entre gobernantes y gobernados: la <em>p&#xf3;lis</em> no concibe un aparato de Estado burocr&#xe1;tico separado de la sociedad civil (Castoriadis, 1988, pp. 123-128).","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"La soberan&#xed;a reside en la asamblea viva (<em>ekkl&#x113;s&#xed;a</em>), sustentada en la igualdad de palabra (<em>is&#x113;gor&#xed;a</em>) y en la franqueza absoluta al decir la verdad (<em>parrh&#x113;s&#xed;a</em>) (Castoriadis, 1988, pp. 125-129).","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"El sorteo de magistraturas como principio fundamental: premisa democr&#xe1;tica de que no existen &quot;expertos&quot; en pol&#xed;tica; todos los ciudadanos poseen el juicio pol&#xed;tico b&#xe1;sico (<em>d&#xf3;xa</em>) (Castoriadis, 1988, pp. 128-131).","children":[],"payload":{"tag":"li","lines":"33,35"}}],"payload":{"tag":"h3","lines":"30,31"}}],"payload":{"tag":"h2","lines":"18,19"}},{"content":"2. El siglo V y la democracia ateniense (Jacqueline de Romilly)","children":[{"content":"La libertad como obediencia consentida a la ley","children":[{"content":"En el choque con el despotismo persa, el griego define su libertad no como anarqu&#xed;a, sino como sometimiento voluntario a una regla com&#xfa;n (<em>n&#xf3;mos</em>) (Romilly, 1997, pp. 87-90).","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"La ley soberana no es impuesta por la fuerza de un amo; emana del pacto c&#xed;vico y de la deliberaci&#xf3;n entre iguales (Romilly, 1997, pp. 88-92).","children":[],"payload":{"tag":"li","lines":"38,39"}}],"payload":{"tag":"h3","lines":"36,37"}},{"content":"La centralidad soberana de la palabra (&apos;l&#xf3;gos&apos;) y el debate","children":[{"content":"El r&#xe9;gimen democr&#xe1;tico instaura la supremac&#xed;a del discurso argumentativo y la confrontaci&#xf3;n dial&#xe9;ctica (Romilly, 1997, pp. 92-95).","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"En la asamblea y en los tribunales del <em>Heliea</em>, la f&#xf3;rmula ritual &quot;&#xbf;qui&#xe9;n quiere tomar la palabra?&quot; abre la tribuna a todo ciudadano, ligando la pol&#xed;tica a la capacidad de convencer (Romilly, 1997, pp. 93-97).","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"La ret&#xf3;rica nace como instrumento pr&#xe1;ctico del litigio y de la asamblea, pero r&#xe1;pidamente se convierte en una herramienta general de an&#xe1;lisis intelectual (Romilly, 1997, pp. 96-98).","children":[],"payload":{"tag":"li","lines":"42,43"}}],"payload":{"tag":"h3","lines":"39,40"}},{"content":"Igualdad c&#xed;vica (&apos;isonom&#xed;a&apos;, &apos;is&#x113;gor&#xed;a&apos;) y leyes escritas","children":[{"content":"La democracia garantiza la igualdad estricta ante la ley: ricos y pobres participan en el mismo tribunal y en las mismas decisiones (Romilly, 1997, pp. 98-101).","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"La fijeza de las leyes escritas protege al d&#xe9;bil contra la arbitrariedad del poderoso y consagra el contrato social que S&#xf3;crates personificar&#xe1; en el <em>Crit&#xf3;n</em> (Romilly, 1997, pp. 100-104).","children":[],"payload":{"tag":"li","lines":"45,46"}}],"payload":{"tag":"h3","lines":"43,44"}},{"content":"El ideal de la tolerancia y la moderaci&#xf3;n c&#xed;vica","children":[{"content":"Frente a la rigidez cuartelaria y polic&#xed;aca de Esparta, Atenas desarrolla una forma original de libertad en la vida cotidiana (Romilly, 1997, pp. 104-107).","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"Como destaca el discurso f&#xfa;nebre de Pericles en Tuc&#xed;dides, la ciudad se precia de la indulgencia y la falta de suspicacia hacia la conducta privada del vecino (Romilly, 1997, pp. 105-108).","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"Apertura y acogida: hospitalidad hacia los extranjeros (<em>x&#xe9;noi</em>), rechazo del secreto de Estado y confianza en la concordia moral por encima de la coacci&#xf3;n exterior (Romilly, 1997, pp. 107-110).","children":[],"payload":{"tag":"li","lines":"49,51"}}],"payload":{"tag":"h3","lines":"46,47"}}],"payload":{"tag":"h2","lines":"35,36"}},{"content":"5. Bibliograf&#xed;a consultada","children":[{"content":"Libros","children":[{"content":"Castoriadis, C. (1988). La polis griega y la creaci&#xf3;n de la democracia. En Los dominios del hombre: Las encrucijadas del laberinto (A. Vicens, Trad., pp. 97-131). Gedisa.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"Romilly, J. de. (1997). El siglo V y la democracia. En &#xbf;Por qu&#xe9; Grecia? (O. Bandr&#xe9;s, Trad., pp. 87-110). Debate.","children":[],"payload":{"tag":"li","lines":"54,55"}}],"payload":{"tag":"h3","lines":"52,53"}}],"payload":{"tag":"h2","lines":"51,52"}}],"payload":{"tag":"h1","lines":"10,11"}},{"color":["#c084fc","#f472b6","#a78bfa","#d8b4fe"],"maxWidth":300})</script>
